name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: graft
          POSTGRES_PASSWORD: graft_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U graft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GRAFT_TEST_DATABASE_URL: postgres://graft:graft_test@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/graft
      - run: go run ./cmd/graft publish --target linux-arm64 --package ./examples/hello --output publish/hello-linux-arm64
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
